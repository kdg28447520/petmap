name: TourAPI raw fetch

# Push runs only when .github/tourapi-trigger.txt changes on tourapi-fetch.
# Ordinary pushes do not match that path, so they do not spend the
# data.go.kr dev-account quota (about 1,000 detail calls/day). The raw-data
# commit below pushes data/tourapi-raw/ with GITHUB_TOKEN, which does not
# retrigger workflows, and it does not touch the trigger file.
#
# GitHub Actions runs scheduled workflows only from the default branch.
# This file lives on tourapi-fetch and is not on main, so the cron below
# does not fire. workflow_dispatch is listed only when the workflow file
# is on the default branch. The path-filtered push is what starts a run
# from this branch. Do not merge this branch into main to start the schedule.
#
# cron '10 15 * * *' is 15:10 UTC, which is 00:10 Asia/Seoul (KST).
# Each run stops at 950 calls and skips detail files already saved under
# data/tourapi-raw/.

on:
  workflow_dispatch:
  schedule:
    - cron: "10 15 * * *"
  push:
    branches:
      - tourapi-fetch
    paths:
      - .github/tourapi-trigger.txt

permissions:
  contents: write

concurrency:
  group: tourapi-fetch
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fetch:
    name: Fetch KorPetTourService2
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout tourapi-fetch
        uses: actions/checkout@v4
        with:
          ref: tourapi-fetch
          fetch-depth: 1
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch raw pages
        env:
          TOURAPI_SERVICE_KEY: ${{ secrets.TOURAPI_SERVICE_KEY }}
        run: bash .github/scripts/tourapi-fetch.sh

      - name: Commit raw responses
        if: always()
        run: |
          set -euo pipefail
          set +x
          git checkout -B tourapi-fetch
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" != "tourapi-fetch" ]; then
            echo "Refusing to commit from branch ${branch}."
            exit 1
          fi
          if [ ! -d data/tourapi-raw ]; then
            echo "No data/tourapi-raw directory to commit."
            exit 0
          fi
          find data/tourapi-raw -name '*.partial' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/tourapi-raw
          if git diff --cached --quiet; then
            echo "No changes under data/tourapi-raw."
            exit 0
          fi
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              data/tourapi-raw/*) ;;
              *)
                echo "Refusing to commit ${path}."
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)
          when=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "Committing $(git diff --cached --name-only | wc -l) files under data/tourapi-raw."
          git commit -m "TourAPI raw fetch ${when}"
          git push origin HEAD:tourapi-fetch
